<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Council of Achrona — Visuele Viewer</title>
  <style>
    :root {
      --bg-dark: #0d0a0e;
      --bg-mid: #1a1520;
      --gold: #d4a84b;
      --gold-dim: #8a6a2f;
      --parchment: #e8d4a8;
      --parchment-dark: #c4a060;
      --candle-orange: #ff9944;
      --candle-yellow: #ffd080;
      --mist: rgba(80, 70, 90, 0.15);
      --grain-opacity: 0.04;

      /* Role colors */
      --color-koning: #d4a84b;
      --color-archmage: #9b59b6;
      --color-engineer: #e67e22;
      --color-guardian_keeper: #3498db;
      --color-historian: #1abc9c;
      --color-oracle: #e74c3c;
      --color-beast_master: #27ae60;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-dark);
      color: var(--parchment);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: var(--grain-opacity);
      pointer-events: none;
      z-index: 1000;
    }

    /* Main container */
    #scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at center, var(--bg-mid) 0%, var(--bg-dark) 70%);
      overflow: hidden;
    }

    /* Vignette */
    #vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 50;
    }

    /* Mist layers */
    .mist {
      position: absolute;
      width: 200%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--mist), transparent, var(--mist), transparent);
      animation: mistDrift 60s linear infinite;
      opacity: 0.5;
      pointer-events: none;
    }
    .mist:nth-child(2) { animation-duration: 45s; animation-direction: reverse; top: 20%; }
    .mist:nth-child(3) { animation-duration: 70s; top: 50%; }

    @keyframes mistDrift {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }

    /* Table */
    #table {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      z-index: 10;
    }

    #table-surface {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #2a2030 0%, #1a1520 60%, #0d0a0e 100%);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.8),
        inset 0 0 60px rgba(0,0,0,0.5),
        0 0 100px rgba(212, 168, 75, 0.1);
      border: 3px solid #3a3040;
    }

    /* SVG container for characters and effects */
    #svg-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }
    #svg-layer > * { pointer-events: auto; }

    /* Character seats */
    .character {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: filter 0.5s ease, transform 0.3s ease;
      cursor: pointer;
      z-index: 25;
    }

    .character.dimmed {
      filter: brightness(0.4);
    }

    .character.speaking {
      filter: brightness(1.3) drop-shadow(0 0 20px var(--candle-orange));
      transform: scale(1.05);
    }

    .character.entering {
      opacity: 0;
      transform: translateY(100px);
    }

    .character-svg {
      width: 80px;
      height: 120px;
    }

    .character-name {
      margin-top: 8px;
      padding: 4px 12px;
      background: rgba(0,0,0,0.7);
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 1px solid;
    }

    /* Koning specific */
    #koning {
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
    }

    #koning .character-svg {
      width: 100px;
      height: 150px;
    }

    #koning-balloon {
      position: absolute;
      top: 170px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 300px;
      padding: 12px 16px;
      background: var(--parchment);
      color: #2a2030;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 35;
    }

    #koning-balloon.visible {
      opacity: 1;
    }

    #koning-balloon::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      border: 10px solid transparent;
      border-bottom-color: var(--parchment);
      border-top: 0;
    }

    /* Paper/parchment */
    .paper {
      position: absolute;
      width: 120px;
      padding: 10px;
      background: var(--parchment);
      color: #2a2030;
      font-size: 11px;
      line-height: 1.3;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 30px rgba(255, 153, 68, 0.3);
      cursor: pointer;
      z-index: 40;
      transform-origin: center center;
      transition: transform 0.6s ease, left 0.6s ease, top 0.6s ease, opacity 0.3s ease;
    }

    .paper.flying {
      animation: paperGlow 0.6s ease;
    }

    @keyframes paperGlow {
      0%, 100% { box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 30px rgba(255, 153, 68, 0.3); }
      50% { box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 50px rgba(255, 153, 68, 0.6); }
    }

    /* Toolcall icon */
    .toolcall-icon {
      position: absolute;
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.8);
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--gold);
      animation: toolcallPulse 1s ease-out forwards;
      z-index: 45;
    }

    @keyframes toolcallPulse {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* Evidence threads */
    .evidence-thread {
      fill: none;
      stroke-width: 2;
      opacity: 0;
      animation: threadAppear 0.5s ease forwards;
    }

    @keyframes threadAppear {
      to { opacity: 0.7; }
    }

    .dispute-thread {
      stroke: #e74c3c;
      stroke-dasharray: 5 5;
      animation: threadAppear 0.5s ease forwards, disputeFlicker 1s ease-in-out infinite;
    }

    @keyframes disputeFlicker {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }

    /* Candles */
    .candle {
      position: absolute;
      width: 20px;
      height: 60px;
      z-index: 5;
    }

    .candle-flame {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 20px;
      background: radial-gradient(ellipse at bottom, var(--candle-yellow) 0%, var(--candle-orange) 50%, transparent 100%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: flicker 0.5s ease-in-out infinite alternate;
      box-shadow: 0 0 20px var(--candle-orange), 0 0 40px rgba(255, 153, 68, 0.5);
    }

    .candle-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 50px;
      background: linear-gradient(to right, #d4c4a0 0%, #f5e6c8 50%, #d4c4a0 100%);
      border-radius: 2px;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 0.9; }
      100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .candle-flame { animation: none; }
      .mist { animation: none; }
      .dispute-thread { animation: threadAppear 0.5s ease forwards; }
    }

    /* Certainty crystals */
    .crystal {
      display: inline-block;
      width: 24px;
      height: 36px;
      margin: 0 4px;
      position: relative;
    }

    .crystal-glow {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 4px 4px 50% 50%;
      transition: opacity 0.5s ease, box-shadow 0.5s ease;
    }

    .crystal.high .crystal-glow {
      background: linear-gradient(to bottom, #7dd3fc, #0ea5e9);
      box-shadow: 0 0 20px #0ea5e9, 0 0 40px rgba(14, 165, 233, 0.5);
      opacity: 1;
    }

    .crystal.medium .crystal-glow {
      background: linear-gradient(to bottom, #fcd34d, #f59e0b);
      box-shadow: 0 0 15px #f59e0b;
      opacity: 0.7;
      animation: crystalFlicker 2s ease-in-out infinite;
    }

    .crystal.low .crystal-glow {
      background: linear-gradient(to bottom, #6b7280, #374151);
      box-shadow: 0 0 5px #374151;
      opacity: 0.4;
      animation: crystalFlicker 1s ease-in-out infinite;
    }

    .crystal.unknown .crystal-glow {
      background: #1f2937;
      opacity: 0.3;
    }

    .crystal.unknown::after {
      content: '?';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #9ca3af;
      font-size: 14px;
      font-weight: bold;
    }

    @keyframes crystalFlicker {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.9; }
    }

    /* Verdict overlay */
    #verdict-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #verdict-overlay.visible {
      display: flex;
      opacity: 1;
    }

    #verdict-scroll {
      width: 80%;
      max-width: 800px;
      max-height: 80vh;
      background: linear-gradient(to bottom, var(--parchment-dark) 0%, var(--parchment) 5%, var(--parchment) 95%, var(--parchment-dark) 100%);
      border-radius: 8px;
      padding: 40px;
      color: #2a2030;
      overflow-y: auto;
      transform: scaleY(0);
      transform-origin: top center;
      transition: transform 0.6s ease;
      box-shadow: 0 0 60px rgba(212, 168, 75, 0.4);
    }

    #verdict-overlay.visible #verdict-scroll {
      transform: scaleY(1);
    }

    #verdict-scroll h2 {
      text-align: center;
      color: #5a4030;
      margin-bottom: 20px;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    #verdict-scroll h3 {
      color: #6a5040;
      margin: 20px 0 10px;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #c4a060;
      padding-bottom: 5px;
    }

    #verdict-scroll p, #verdict-scroll li {
      line-height: 1.6;
      margin-bottom: 10px;
    }

    #verdict-scroll ul {
      padding-left: 20px;
    }

    .oorzaak-slot {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 15px;
      padding: 10px;
      background: rgba(0,0,0,0.05);
      border-radius: 6px;
    }

    .oorzaak-slot .label {
      font-weight: bold;
      min-width: 100px;
      color: #5a4030;
    }

    .oorzaak-slot .bewijs {
      font-size: 12px;
      color: #7a6050;
      margin-top: 4px;
    }

    #verdict-seal {
      display: block;
      width: 100px;
      height: 100px;
      margin: 30px auto 0;
      background: radial-gradient(circle, var(--gold) 0%, var(--gold-dim) 100%);
      border-radius: 50%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 2px 10px rgba(255,255,255,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      animation: sealStamp 0.6s ease-out;
      transition: transform 0.2s ease;
    }

    #verdict-seal:hover {
      transform: scale(1.05);
    }

    @keyframes sealStamp {
      0% { transform: translateY(-200px) scale(1.5); opacity: 0; }
      70% { transform: translateY(10px) scale(0.95); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Sidebar */
    #sidebar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.8);
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
      padding: 15px;
      z-index: 60;
      min-width: 200px;
    }

    #sidebar h4 {
      color: var(--gold);
      margin-bottom: 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #sidebar .stat {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }

    #sidebar .stat-label {
      color: #9ca3af;
    }

    #sidebar .stat-value {
      color: var(--parchment);
    }

    #replay-controls {
      margin-top: 15px;
      display: flex;
      gap: 8px;
    }

    #replay-controls button {
      flex: 1;
      padding: 8px;
      background: var(--gold-dim);
      color: var(--bg-dark);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    #replay-controls button:hover {
      background: var(--gold);
    }

    #replay-controls button.active {
      background: var(--gold);
    }

    /* Full text modal */
    #text-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 90;
    }

    #text-modal.visible {
      display: flex;
    }

    #text-modal-content {
      max-width: 600px;
      max-height: 80vh;
      background: var(--parchment);
      color: #2a2030;
      padding: 30px;
      border-radius: 8px;
      overflow-y: auto;
      cursor: pointer;
    }

    #text-modal-content h4 {
      margin-bottom: 15px;
      color: #5a4030;
    }

    /* Thread tooltip */
    #thread-tooltip {
      position: fixed;
      background: rgba(0,0,0,0.9);
      color: var(--parchment);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 80;
      display: none;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <div id="scene">
    <div class="mist"></div>
    <div class="mist"></div>
    <div class="mist"></div>

    <div id="table">
      <div id="table-surface"></div>
    </div>

    <svg id="svg-layer" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <g id="threads-layer"></g>
    </svg>

    <div id="characters"></div>
    <div id="candles"></div>
    <div id="papers"></div>

    <div id="vignette"></div>
  </div>

  <div id="koning-balloon"></div>

  <div id="sidebar">
    <h4>Council Status</h4>
    <div class="stat">
      <span class="stat-label">Beurten:</span>
      <span class="stat-value" id="stat-beurten">0 / 10</span>
    </div>
    <div class="stat">
      <span class="stat-label">Klein tokens:</span>
      <span class="stat-value" id="stat-klein">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Groot tokens:</span>
      <span class="stat-value" id="stat-groot">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Status:</span>
      <span class="stat-value" id="stat-status">wachten...</span>
    </div>
    <div id="replay-controls">
      <button id="btn-replay" title="Replay">▶ Replay</button>
      <button id="btn-speed" data-speed="1">1x</button>
    </div>
  </div>

  <div id="verdict-overlay">
    <div id="verdict-scroll">
      <h2>Council Verdict</h2>
      <div id="verdict-content"></div>
      <div id="verdict-seal">👑</div>
    </div>
  </div>

  <div id="text-modal">
    <div id="text-modal-content">
      <h4 id="text-modal-title"></h4>
      <p id="text-modal-text"></p>
    </div>
  </div>

  <div id="thread-tooltip"></div>

  <script>
    // ============================================
    // CONSTANTS AND STATE
    // ============================================
    const ROLE_COLORS = {
      koning: '#d4a84b',
      archmage: '#9b59b6',
      engineer: '#e67e22',
      guardian_keeper: '#3498db',
      historian: '#1abc9c',
      oracle: '#e74c3c',
      beast_master: '#27ae60'
    };

    const ROLE_NAMES = {
      koning: 'Koning',
      archmage: 'Archmage',
      engineer: 'Engineer',
      guardian_keeper: 'Guardian Keeper',
      historian: 'Historian',
      oracle: 'Oracle',
      beast_master: 'Beast Master'
    };

    const EXPRESSIONS = ['neutraal', 'nadenkend', 'tevreden', 'wantrouwig', 'boos', 'verrast'];

    const EXPRESSION_KEYWORDS = {
      wantrouwig: ['tegenspraak', 'onzeker', 'geen bewijs', 'twijfel', 'onduidelijk', 'onbevestigd'],
      tevreden: ['bevestigd', 'klopt', 'correct', 'akkoord', 'eens', 'bewezen'],
      boos: ['verzonnen', 'fout', 'onjuist', 'vals', 'leugen'],
      verrast: ['onverwacht', 'vreemd', 'merkwaardig', 'plots', 'nieuw'],
      nadenkend: ['misschien', 'mogel', 'wellicht', 'overweeg']
    };

    let state = {
      trace: null,
      verdict: null,
      processedBeurten: new Set(),
      characters: {},
      seatPositions: {},
      evidenceByRole: {},
      sharedEvidence: {},
      replayMode: false,
      replaySpeed: 1,
      animationQueue: [],
      isAnimating: false,
      currentSpeaker: null,
      koningExpression: 'neutraal'
    };

    // ============================================
    // SVG CHARACTER TEMPLATES
    // ============================================
    function createKoningSVG(expression = 'neutraal') {
      const expressions = {
        neutraal: { eyeY: 45, browY: 38, mouthPath: 'M 40 65 Q 50 65 60 65' },
        nadenkend: { eyeY: 44, browY: 36, mouthPath: 'M 40 65 Q 50 68 60 65' },
        tevreden: { eyeY: 45, browY: 38, mouthPath: 'M 40 63 Q 50 70 60 63' },
        wantrouwig: { eyeY: 46, browY: 40, mouthPath: 'M 40 68 Q 50 65 60 68' },
        boos: { eyeY: 47, browY: 42, mouthPath: 'M 40 70 Q 50 65 60 70' },
        verrast: { eyeY: 43, browY: 35, mouthPath: 'M 45 65 Q 50 72 55 65' }
      };
      const exp = expressions[expression] || expressions.neutraal;

      return `
        <svg viewBox="0 0 100 150" class="character-svg">
          <!-- Throne back -->
          <path d="M 20 80 L 15 30 L 25 20 L 50 15 L 75 20 L 85 30 L 80 80" fill="#3a2820" stroke="#5a4030" stroke-width="2"/>

          <!-- Body/Mantle -->
          <ellipse cx="50" cy="110" rx="35" ry="30" fill="#1a1020"/>
          <path d="M 25 90 Q 50 85 75 90 L 80 140 L 20 140 Z" fill="#2a1830"/>

          <!-- Gold trim -->
          <path d="M 25 90 Q 50 85 75 90" stroke="${ROLE_COLORS.koning}" stroke-width="3" fill="none"/>

          <!-- Head -->
          <ellipse cx="50" cy="55" rx="20" ry="25" fill="#d4a88a"/>

          <!-- Crown -->
          <path d="M 25 35 L 30 20 L 38 30 L 50 10 L 62 30 L 70 20 L 75 35 L 70 40 L 30 40 Z"
                fill="${ROLE_COLORS.koning}" stroke="#8a6a2f" stroke-width="1"/>
          <!-- Crown jewels -->
          <circle cx="50" cy="22" r="4" fill="#e74c3c">
            <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="35" cy="28" r="2" fill="#3498db"/>
          <circle cx="65" cy="28" r="2" fill="#2ecc71"/>

          <!-- Eyes -->
          <ellipse cx="42" cy="${exp.eyeY}" rx="4" ry="3" fill="#2a1830"/>
          <ellipse cx="58" cy="${exp.eyeY}" rx="4" ry="3" fill="#2a1830"/>
          <circle cx="43" cy="${exp.eyeY - 1}" r="1" fill="white"/>
          <circle cx="59" cy="${exp.eyeY - 1}" r="1" fill="white"/>

          <!-- Eyebrows -->
          <path d="M 36 ${exp.browY} Q 42 ${exp.browY - 2} 48 ${exp.browY}" stroke="#5a4030" stroke-width="2" fill="none"/>
          <path d="M 52 ${exp.browY} Q 58 ${exp.browY - 2} 64 ${exp.browY}" stroke="#5a4030" stroke-width="2" fill="none"/>

          <!-- Mouth -->
          <path d="${exp.mouthPath}" stroke="#8a5040" stroke-width="2" fill="none"/>

          <!-- Beard -->
          <path d="M 35 60 Q 50 85 65 60" fill="#6a5040" opacity="0.5"/>
        </svg>
      `;
    }

    function createRoleSVG(role) {
      const color = ROLE_COLORS[role] || '#888';
      const templates = {
        archmage: `

    // ============================================
    // INITIALIZATION
    // ============================================
    function init() {
      createCandles();
      startPolling();
      setupEventListeners();
    }

    function createCandles() {
      const container = document.getElementById('candles');
      const positions = [
        { x: '20%', y: '30%' },
        { x: '80%', y: '30%' },
        { x: '15%', y: '60%' },
        { x: '85%', y: '60%' },
        { x: '30%', y: '80%' },
        { x: '70%', y: '80%' },
        { x: '50%', y: '15%' },
        { x: '50%', y: '85%' }
      ];

      positions.forEach((pos, i) => {
        const candle = document.createElement('div');
        candle.className = 'candle';
        candle.style.left = pos.x;
        candle.style.top = pos.y;
        candle.innerHTML = `
          <div class="candle-flame" style="animation-delay: ${i * 0.1}s"></div>
          <div class="candle-body"></div>
        `;
        container.appendChild(candle);
      });
    }

    function calculateSeatPositions(roles) {
      const positions = {};
      const tableRect = document.getElementById('table').getBoundingClientRect();
      const centerX = tableRect.left + tableRect.width / 2;
      const centerY = tableRect.top + tableRect.height / 2;
      const radius = tableRect.width / 2 + 80;

      // Koning always at top
      positions.koning = {
        x: centerX,
        y: tableRect.top - 40
      };

      // Other roles distributed around, starting from bottom-left going clockwise
      const startAngle = Math.PI * 0.6; // Start from bottom-left
      const endAngle = Math.PI * 2.4; // End at bottom-right (going around)
      const angleStep = (endAngle - startAngle) / (roles.length + 1);

      // Use a seeded random for consistent positioning
      const seed = roles.join('').split('').reduce((a, b) => a + b.charCodeAt(0), 0);
      const shuffled = [...roles].sort(() => (Math.sin(seed) + 1) / 2 - 0.5);

      shuffled.forEach((role, i) => {
        const angle = startAngle + angleStep * (i + 1);
        positions[role] = {
          x: centerX + Math.cos(angle) * radius,
          y: centerY + Math.sin(angle) * radius
        };
      });

      return positions;
    }

    function createCharacters(roles) {
      const container = document.getElementById('characters');
      container.innerHTML = '';

      state.seatPositions = calculateSeatPositions(roles);

      // Create Koning
      const koning = document.createElement('div');
      koning.id = 'koning';
      koning.className = 'character entering';
      koning.innerHTML = createKoningSVG('neutraal');
      koning.innerHTML += `<span class="character-name" style="border-color: ${ROLE_COLORS.koning}">Koning</span>`;
      container.appendChild(koning);
      state.characters.koning = koning;

      // Create other characters
      roles.forEach(role => {
        const char = document.createElement('div');
        char.className = 'character entering';
        char.dataset.role = role;
        char.innerHTML = createRoleSVG(role);
        char.innerHTML += `<span class="character-name" style="border-color: ${ROLE_COLORS[role]}">${ROLE_NAMES[role] || role}</span>`;
        container.appendChild(char);
        state.characters[role] = char;
      });

      // Position characters (they start off-screen)
      positionCharacters();

      // Animate entrance
      setTimeout(() => animateEntrance(roles), 500);
    }

    function positionCharacters() {
      Object.entries(state.characters).forEach(([role, el]) => {
        const pos = state.seatPositions[role];
        if (pos) {
          el.style.left = pos.x + 'px';
          el.style.top = pos.y + 'px';
          el.style.transform = 'translate(-50%, -50%)';
        }
      });
    }

    function animateEntrance(roles) {
      const allRoles = ['koning', ...roles];
      let delay = 0;

      allRoles.forEach(role => {
        setTimeout(() => {
          const char = state.characters[role];
          if (char) {
            char.classList.remove('entering');
          }
        }, delay);
        delay += 600;
      });
    }

    // ============================================
    // POLLING AND DATA PROCESSING
    // ============================================
    async function startPolling() {
      await poll();
      setInterval(poll, 1000);
    }

    async function poll() {
      if (state.replayMode) return;

      try {
        const traceRes = await fetch('trace.json', { cache: 'no-store' });
        if (traceRes.ok) {
          const trace = await traceRes.json();
          processTrace(trace);
        }
      } catch (e) {
        // File not ready yet
      }

      try {
        const verdictRes = await fetch('verdict.json', { cache: 'no-store' });
        if (verdictRes.ok) {
          const verdict = await verdictRes.json();
          if (!state.verdict || state.verdict.run_id !== verdict.run_id) {
            state.verdict = verdict;
            if (state.trace && state.trace.status === 'klaar') {
              showVerdict();
            }
          }
        }
      } catch (e) {
        // Verdict not ready yet
      }
    }

    function processTrace(trace) {
      if (!state.trace || state.trace.run_id !== trace.run_id) {
        // New run, reset everything
        state.trace = trace;
        state.processedBeurten = new Set();
        state.evidenceByRole = {};
        state.sharedEvidence = {};
        state.animationQueue = [];
        document.getElementById('threads-layer').innerHTML = '';
        document.getElementById('papers').innerHTML = '';

        if (trace.raadsleden && trace.raadsleden.length > 0) {
          createCharacters(trace.raadsleden);
        }
      } else {
        state.trace = trace;
      }

      // Process new beurten
      if (trace.beurten) {
        trace.beurten.forEach(beurt => {
          if (!state.processedBeurten.has(beurt.nr)) {
            state.processedBeurten.add(beurt.nr);
            queueAnimation(() => processBeurt(beurt));
          }
        });
      }

      // Update stats
      updateStats();

      // Process geschillen
      if (trace.geschillen && trace.geschillen.length > 0) {
        processGeschillen(trace.geschillen);
      }
    }

    function queueAnimation(fn) {
      state.animationQueue.push(fn);
      processQueue();
    }

    async function processQueue() {
      if (state.isAnimating || state.animationQueue.length === 0) return;

      state.isAnimating = true;
      const fn = state.animationQueue.shift();
      await fn();
      state.isAnimating = false;

      // Small delay between animations
      setTimeout(() => processQueue(), 300 / state.replaySpeed);
    }

    async function processBeurt(beurt) {
      const delay = ms => new Promise(r => setTimeout(r, ms / state.replaySpeed));

      switch (beurt.soort) {
        case 'routering':
          await processRoutering(beurt);
          break;
        case 'bericht':
          await processBericht(beurt);
          break;
        case 'toolcall':
          await processToolcall(beurt);
          break;
      }

      await delay(500);
    }

    async function processRoutering(beurt) {
      const delay = ms => new Promise(r => setTimeout(r, ms / state.replaySpeed));

      // Update Koning expression
      const expression = detectExpression(beurt.reden || '');
      updateKoningExpression(expression);

      // Show balloon
      const balloon = document.getElementById('koning-balloon');
      balloon.textContent = beurt.reden || '';
      balloon.classList.add('visible');

      if (beurt.aan === null) {
        // Debate ends
        await delay(1000);
        balloon.classList.remove('visible');
        return;
      }

      // Send paper to the chosen role
      if (beurt.aan && state.seatPositions[beurt.aan]) {
        await sendPaper('koning', beurt.aan, beurt.vraag || '', ROLE_COLORS[beurt.aan]);
      }

      // Highlight speaker
      setSpeaker(beurt.aan);

      await delay(1500);
      balloon.classList.remove('visible');
    }

    async function processBericht(beurt) {
      const delay = ms => new Promise(r => setTimeout(r, ms / state.replaySpeed));

      // Extract evidence IDs
      const ids = extractEvidenceIds(beurt.tekst || '');
      if (ids.length > 0) {
        if (!state.evidenceByRole[beurt.spreker]) {
          state.evidenceByRole[beurt.spreker] = new Set();
        }
        ids.forEach(id => {
          state.evidenceByRole[beurt.spreker].add(id);
          checkSharedEvidence(id, beurt.spreker);
        });
      }

      // Check if another role is mentioned
      const mentionedRole = detectMentionedRole(beurt.tekst || '', beurt.spreker);

      // Send paper back to Koning (or to mentioned role first)
      const shortText = (beurt.tekst || '').slice(0, 120) + ((beurt.tekst || '').length > 120 ? '...' : '');

      if (mentionedRole && state.seatPositions[mentionedRole]) {
        await sendPaper(beurt.spreker, mentionedRole, shortText, ROLE_COLORS[beurt.spreker]);
        await delay(800);
      }

      await sendPaper(beurt.spreker, 'koning', shortText, ROLE_COLORS[beurt.spreker], beurt.tekst);

      // Update Koning expression based on content
      const expression = detectExpression(beurt.tekst || '');
      updateKoningExpression(expression);

      await delay(500);
      setSpeaker(null);
    }

    async function processToolcall(beurt) {
      const delay = ms => new Promise(r => setTimeout(r, ms / state.replaySpeed));

      const char = state.characters[beurt.spreker];
      if (!char) return;

      const pos = state.seatPositions[beurt.spreker];
      if (!pos) return;

      // Show toolcall icon
      const icon = document.createElement('div');
      icon.className = 'toolcall-icon';
      icon.innerHTML = '📜';
      icon.style.left = (pos.x - 20) + 'px';
      icon.style.top = (pos.y - 80) + 'px';
      icon.title = beurt.tool || 'tool';
      document.getElementById('papers').appendChild(icon);

      await delay(1000);
      icon.remove();
    }

    // ============================================
    // PAPER ANIMATIONS
    // ============================================
    async function sendPaper(from, to, text, color, fullText = null) {
      const delay = ms => new Promise(r => setTimeout(r, ms / state.replaySpeed));

      const fromPos = state.seatPositions[from];
      const toPos = state.seatPositions[to];
      if (!fromPos || !toPos) return;

      const paper = document.createElement('div');
      paper.className = 'paper';
      paper.style.left = fromPos.x + 'px';
      paper.style.top = fromPos.y + 'px';
      paper.style.borderLeft = `4px solid ${color}`;
      paper.textContent = text;
      paper.dataset.fullText = fullText || text;
      paper.dataset.from = ROLE_NAMES[from] || from;

      paper.onclick = () => showFullText(paper.dataset.from, paper.dataset.fullText);

      document.getElementById('papers').appendChild(paper);

      // Trigger reflow
      paper.offsetHeight;

      // Animate to destination
      paper.classList.add('flying');
      paper.style.left = toPos.x + 'px';
      paper.style.top = toPos.y + 'px';
      paper.style.transform = `translate(-50%, -50%) rotate(${(Math.random() - 0.5) * 10}deg)`;

      await delay(600);
      paper.classList.remove('flying');

      // Fade out old papers if too many
      const papers = document.querySelectorAll('.paper');
      if (papers.length > 10) {
        papers[0].style.opacity = '0';
        setTimeout(() => papers[0].remove(), 300);
      }
    }

    // ============================================
    // EVIDENCE THREADS
    // ============================================
    function extractEvidenceIds(text) {
      // Replace special hyphens
      const normalized = text.replace(/‑/g, '-');
      const regex = /\b(ARC|ENG|GUA|HIS|ORA|BEA)-\d{3}\b/g;
      const matches = normalized.match(regex) || [];
      return [...new Set(matches)];
    }

    function checkSharedEvidence(id, role) {
      Object.entries(state.evidenceByRole).forEach(([otherRole, ids]) => {
        if (otherRole !== role && ids.has(id)) {
          const key = [role, otherRole].sort().join('-');
          if (!state.sharedEvidence[key]) {
            state.sharedEvidence[key] = new Set();
          }
          state.sharedEvidence[key].add(id);
          drawEvidenceThread(role, otherRole, state.sharedEvidence[key]);
        }
      });
    }

    function drawEvidenceThread(role1, role2, sharedIds) {
      const svg = document.getElementById('threads-layer');
      const key = [role1, role2].sort().join('-');

      // Remove existing thread
      const existing = svg.querySelector(`[data-thread="${key}"]`);
      if (existing) existing.remove();

      const pos1 = state.seatPositions[role1];
      const pos2 = state.seatPositions[role2];
      if (!pos1 || !pos2) return;

      // Convert to SVG viewBox coordinates
      const scene = document.getElementById('scene');
      const svgEl = document.getElementById('svg-layer');
      const rect = scene.getBoundingClientRect();

      const x1 = (pos1.x / rect.width) * 100;
      const y1 = (pos1.y / rect.height) * 100;
      const x2 = (pos2.x / rect.width) * 100;
      const y2 = (pos2.y / rect.height) * 100;

      // Create curved path
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2 - 5;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`);
      path.setAttribute('class', 'evidence-thread');
      path.setAttribute('data-thread', key);
      path.setAttribute('data-ids', [...sharedIds].join(', '));

      // Color gradient between the two roles
      const color1 = ROLE_COLORS[role1] || '#888';
      const color2 = ROLE_COLORS[role2] || '#888';
      path.setAttribute('stroke', color1);
      path.setAttribute('stroke-width', Math.min(2 + sharedIds.size, 6));
      path.setAttribute('filter', 'url(#glow)');

      path.onmouseenter = (e) => showThreadTooltip(e, [...sharedIds]);
      path.onmouseleave = hideThreadTooltip;

      svg.appendChild(path);
    }

    function processGeschillen(geschillen) {
      const svg = document.getElementById('threads-layer');

      geschillen.forEach((geschil, i) => {
        if (!geschil.standpunten || geschil.standpunten.length < 2) return;

        const roles = geschil.standpunten.map(s => s.rol);

        // Draw dispute thread between all involved roles
        for (let j = 0; j < roles.length - 1; j++) {
          const key = `dispute-${i}-${j}`;
          if (svg.querySelector(`[data-thread="${key}"]`)) continue;

          const pos1 = state.seatPositions[roles[j]];
          const pos2 = state.seatPositions[roles[j + 1]];
          if (!pos1 || !pos2) continue;

          const scene = document.getElementById('scene');
          const rect = scene.getBoundingClientRect();

          const x1 = (pos1.x / rect.width) * 100;
          const y1 = (pos1.y / rect.height) * 100;
          const x2 = (pos2.x / rect.width) * 100;
          const y2 = (pos2.y / rect.height) * 100;

          const midX = (x1 + x2) / 2;
          const midY = (y1 + y2) / 2 + 5;

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`);
          path.setAttribute('class', 'evidence-thread dispute-thread');
          path.setAttribute('data-thread', key);
          path.setAttribute('filter', 'url(#glow)');

          path.onmouseenter = (e) => showThreadTooltip(e, [geschil.onderwerp || 'Geschil'], true);
          path.onmouseleave = hideThreadTooltip;

          svg.appendChild(path);
        }
      });
    }

    function showThreadTooltip(e, items, isDispute = false) {
      const tooltip = document.getElementById('thread-tooltip');
      tooltip.innerHTML = isDispute
        ? `<strong>⚔️ Geschil:</strong><br>${items.join('<br>')}`
        : `<strong>Gedeeld bewijs:</strong><br>${items.join(', ')}`;
      tooltip.style.left = e.pageX + 10 + 'px';
      tooltip.style.top = e.pageY + 10 + 'px';
      tooltip.style.display = 'block';
    }

    function hideThreadTooltip() {
      document.getElementById('thread-tooltip').style.display = 'none';
    }

    // ============================================
    // EXPRESSION DETECTION
    // ============================================
    function detectExpression(text) {
      const lower = text.toLowerCase();

      for (const [expression, keywords] of Object.entries(EXPRESSION_KEYWORDS)) {
        if (keywords.some(kw => lower.includes(kw))) {
          return expression;
        }
      }

      return 'neutraal';
    }

    function updateKoningExpression(expression) {
      if (state.koningExpression === expression) return;
      state.koningExpression = expression;

      const koning = state.characters.koning;
      if (!koning) return;

      const name = koning.querySelector('.character-name');
      koning.innerHTML = createKoningSVG(expression);
      if (name) koning.appendChild(name);
    }

    function detectMentionedRole(text, speaker) {
      const lower = text.toLowerCase();
      const roles = Object.keys(ROLE_NAMES).filter(r => r !== 'koning' && r !== speaker);

      for (const role of roles) {
        const name = ROLE_NAMES[role].toLowerCase();
        if (lower.includes(name) || lower.includes(role.replace('_', ' '))) {
          return role;
        }
      }

      return null;
    }

    // ============================================
    // UI HELPERS
    // ============================================
    function setSpeaker(role) {
      Object.entries(state.characters).forEach(([r, el]) => {
        el.classList.remove('speaking', 'dimmed');
        if (role && r !== role && r !== 'koning') {
          el.classList.add('dimmed');
        } else if (r === role) {
          el.classList.add('speaking');
        }
      });
      state.currentSpeaker = role;
    }

    function updateStats() {
      const trace = state.trace;
      if (!trace) return;

      const beurten = trace.beurten ? trace.beurten.filter(b =>
        b.soort === 'bericht' && b.spreker !== 'koning'
      ).length : 0;

      document.getElementById('stat-beurten').textContent = `${beurten} / 10`;
      document.getElementById('stat-status').textContent = trace.status || 'bezig';

      if (trace.verbruik) {
        const klein = trace.verbruik.klein;
        const groot = trace.verbruik.groot;
        document.getElementById('stat-klein').textContent = klein
          ? `${klein.invoer + klein.uitvoer}`
          : '0';
        document.getElementById('stat-groot').textContent = groot
          ? `${groot.invoer + groot.uitvoer}`
          : '0';
      }
    }

    function showFullText(from, text) {
      document.getElementById('text-modal-title').textContent = from;
      document.getElementById('text-modal-text').textContent = text;
      document.getElementById('text-modal').classList.add('visible');
    }

    // ============================================
    // VERDICT
    // ============================================
    function showVerdict() {
      if (!state.verdict) return;

      const v = state.verdict;
      let html = '';

      // Summary
      if (v.samenvatting) {
        html += `<p>${v.samenvatting}</p>`;
      }

      // Oorzaak with crystals
      if (v.oorzaak) {
        html += '<h3>Oorzaak</h3>';

        ['ingreep', 'mechanisme', 'verloop'].forEach(slot => {
          const data = v.oorzaak[slot] || {};
          const zekerheid = data.zekerheid ?? 0.5;
          const bewering = data.bewering;
          const bewijs = data.bewijs || [];

          let crystalClass = 'medium';
          if (bewering === null) crystalClass = 'unknown';
          else if (zekerheid >= 0.7) crystalClass = 'high';
          else if (zekerheid < 0.4) crystalClass = 'low';

          html += `
            <div class="oorzaak-slot">
              <div class="crystal ${crystalClass}"><div class="crystal-glow"></div></div>
              <div>
                <div class="label">${slot.charAt(0).toUpperCase() + slot.slice(1)}</div>
                <div>${bewering || '<em>Onbekend</em>'}</div>
                ${bewijs.length > 0 ? `<div class="bewijs">Bewijs: ${bewijs.join(', ')}</div>` : ''}
              </div>
            </div>
          `;
        });
      }

      // Acties
      if (v.acties && v.acties.length > 0) {
        html += '<h3>Herstelplan</h3><ul>';
        v.acties.forEach((a, i) => {
          html += `<li><strong>${i + 1}. ${a.actie}</strong><br><em>${a.reden || ''}</em></li>`;
        });
        html += '</ul>';
      }

      // Risico's
      if (v.risicos && v.risicos.length > 0) {
        html += '<h3>Risico\'s</h3><ul>';
        v.risicos.forEach(r => {
          html += `<li><strong>${r.risico}</strong><br><em>Mitigatie: ${r.mitigatie || '-'}</em></li>`;
        });
        html += '</ul>';
      }

      document.getElementById('verdict-content').innerHTML = html;

      // Show overlay
      setTimeout(() => {
        document.getElementById('verdict-overlay').classList.add('visible');
      }, 500);
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    function setupEventListeners() {
      // Close text modal
      document.getElementById('text-modal').onclick = () => {
        document.getElementById('text-modal').classList.remove('visible');
      };

      // Close verdict
      document.getElementById('verdict-seal').onclick = () => {
        document.getElementById('verdict-overlay').classList.remove('visible');
      };

      // Replay button
      document.getElementById('btn-replay').onclick = startReplay;

      // Speed button
      document.getElementById('btn-speed').onclick = (e) => {
        const speeds = [1, 2, 4];
        const current = state.replaySpeed;
        const next = speeds[(speeds.indexOf(current) + 1) % speeds.length];
        state.replaySpeed = next;
        e.target.textContent = next + 'x';
      };

      // Window resize
      window.addEventListener('resize', () => {
        if (state.trace && state.trace.raadsleden) {
          state.seatPositions = calculateSeatPositions(state.trace.raadsleden);
          positionCharacters();
        }
      });
    }

    async function startReplay() {
      if (!state.trace || !state.trace.beurten) return;

      state.replayMode = true;
      state.processedBeurten = new Set();
      state.evidenceByRole = {};
      state.sharedEvidence = {};
      state.animationQueue = [];
      document.getElementById('threads-layer').innerHTML = '';
      document.getElementById('papers').innerHTML = '';
      document.getElementById('verdict-overlay').classList.remove('visible');

      // Re-queue all beurten
      state.trace.beurten.forEach(beurt => {
        queueAnimation(() => processBeurt(beurt));
      });

      // Wait for queue to empty, then show verdict
      const checkDone = setInterval(() => {
        if (state.animationQueue.length === 0 && !state.isAnimating) {
          clearInterval(checkDone);
          state.replayMode = false;
          if (state.verdict && state.trace.status === 'klaar') {
            showVerdict();
          }
        }
      }, 100);
    }

    // ============================================
    // START
    // ============================================
    window.onload = init;
  </script>
</body>
</html>
